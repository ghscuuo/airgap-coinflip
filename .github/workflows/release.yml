name: Deterministic Build Release

on:
  push:
    tags:
      - 'v*'

# Set permissions block to read-only globally
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Restrict write permissions strictly to the job that creates/uploads the release
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Verify Deterministic Artifact
        run: |
          export SOURCE_DATE_EPOCH=1700000000
          export TZ=UTC
          npm run build

      - name: Extract Build Hash
        id: hash
        run: |
          HTML_FILE=$(ls dist/airgap-coinflip_*.html | head -n 1)
          echo "html_file=$HTML_FILE" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: softprops/action-gh-release@c062e08bd532815e2089a8070857327429186641 # v2.0.8
        with:
          files: ${{ steps.hash.outputs.html_file }}
          generate_release_notes: true
